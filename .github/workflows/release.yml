name: Release

# Push a tag like v0.3.0 to publish to npm (needs the NPM_TOKEN secret unless the
# version was already published by hand) and to the MCP Registry (GitHub OIDC).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + MCP Registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json and server.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').packages[0].version")" = "$TAG"

      - run: npm ci
      - run: npm test

      - name: Publish to npm (skipped if this version is already published)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm (published by hand); skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher (pinned, checksum verified)
        env:
          MCP_PUBLISHER_VERSION: "1.8.4"
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/$asset"
          curl -fsSL "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" -o checksums.txt
          grep " $asset\$" checksums.txt | sha256sum --check --strict
          tar xzf "$asset" mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
