name: Release

# Push a tag like v0.3.0 to publish to npm and the MCP Registry.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + MCP Registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json and server.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').packages[0].version")" = "$TAG"

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
